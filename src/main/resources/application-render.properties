spring.datasource.url=jdbc:postgresql://${ARAM_DB_HOST}:${ARAM_DB_PORT}/${ARAM_DB_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=true

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.documents.storage-dir=${ARAM_DOCUMENT_STORAGE_DIR:/tmp/aram-office/documents}
app.security.initial-admin.username=${ARAM_ADMIN_USERNAME:}
app.security.initial-admin.password=${ARAM_ADMIN_PASSWORD:}
