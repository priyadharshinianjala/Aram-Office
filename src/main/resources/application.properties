spring.datasource.url=jdbc:mariadb://localhost:3307/aram_office
spring.datasource.username=aram_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=${SERVER_PORT:8081}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.documents.storage-dir=${ARAM_DOCUMENT_STORAGE_DIR:${user.home}/.aram-office/documents}

app.security.initial-admin.username=${ARAM_ADMIN_USERNAME:}
app.security.initial-admin.password=${ARAM_ADMIN_PASSWORD:}
app.security.initial-user.username=${ARAM_USER_USERNAME:}
app.security.initial-user.password=${ARAM_USER_PASSWORD:}
app.security.initial-user.citizen-ids=${ARAM_USER_CITIZEN_IDS:}