spring.datasource.url=jdbc:h2:mem:egovernance-demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:demo-schema.sql
spring.sql.init.data-locations=classpath:demo-data.sql
app.documents.storage-dir=${ARAM_DOCUMENT_STORAGE_DIR:${user.home}/.aram-office/demo-documents}
app.security.initial-admin.username=${ARAM_ADMIN_USERNAME:}
app.security.initial-admin.password=${ARAM_ADMIN_PASSWORD:}
